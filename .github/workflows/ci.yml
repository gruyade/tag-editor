name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri/WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test (workspace)
        # --release で実行する（debug ビルドの image クレートによる画像
        # プロパティテストの低速化を避けるため）。並列実行（既定）で問題ない。
        #
        # ONNX Runtime（ort crate, load-dynamic）は CI に配置していない。
        # 実 ort::Session を構築する経路（build_session）に到達するテストは
        # #[ignore] 済みで、デフォルトのテスト実行では走らない。
        # 理由: ort crate はプロセス終了時に C++ 側デストラクタより先に
        # ReleaseEnv を呼ぶための特殊なリンカセクションフックを使っており、
        # 環境（OS・dlopen/dlclose の順序）によって終了時に SIGSEGV /
        # STATUS_STACK_BUFFER_OVERRUN で異常終了することが GitHub Actions
        # の Ubuntu/Windows 両方で確認された。この解放順序は ort crate 内部の
        # 実装詳細であり、アプリ側のコードや CI 設定では制御できないため、
        # 実 ONNX Runtime を使うテストは対象から外す（ONNX Runtime を配置
        # すればロード自体は成功しモデル読込エラー判定も正しく動く。ローカルで
        # 実機検証する場合は `cargo test -- --ignored` で個別に実行する）。
        run: cargo test --workspace --release --verbose

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri/WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --workspace --release --target ${{ matrix.target }}