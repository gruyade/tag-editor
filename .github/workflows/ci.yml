name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri/WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Download ONNX Runtime (Linux)
        if: matrix.os == 'ubuntu-latest'
        # ort（load-dynamic）が実行時にロードする共有ライブラリを用意する。
        # 未配置だと Session 構築時に ort 内部の Mutex が poison したまま
        # unwind 不能な panic を起こし、プロセスが SIGABRT で異常終了する。
        run: |
          curl -sL -o onnxruntime.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-linux-x64-1.19.2.tgz
          tar xzf onnxruntime.tgz
          echo "ORT_DYLIB_PATH=$PWD/onnxruntime-linux-x64-1.19.2/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Download ONNX Runtime (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # 同上（Windows 版）。未配置だと Session 構築時に ort 内部の状態が
        # 壊れ、プロセスが STATUS_STACK_BUFFER_OVERRUN で異常終了する。
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-win-x64-1.19.2.zip" -OutFile onnxruntime.zip
          Expand-Archive -Path onnxruntime.zip -DestinationPath .
          echo "ORT_DYLIB_PATH=$PWD\onnxruntime-win-x64-1.19.2\lib\onnxruntime.dll" >> $env:GITHUB_ENV

      - name: Run cargo test (workspace)
        # --release で実行する（debug ビルドの image クレートによる画像
        # プロパティテストの低速化を避けるため）。並列実行（既定）で問題ない。
        # ORT_DYLIB_PATH は上記ステップで設定済みで、build_session が
        # ort::init_from 経由で明示的にロードする。
        run: cargo test --workspace --release --verbose

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri/WebKitGTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --workspace --release --target ${{ matrix.target }}